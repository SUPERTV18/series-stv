<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>مكتبة المسلسلات الأجنبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--card:#14141f;--card2:#1e1e2e;--line:#262637;--fg:#f5f4fa;--mut:#9795ab;--ac:#7c5cff;--gold:#ffd166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:'Outfit','Cairo',Tahoma,Arial,sans-serif;line-height:1.7;background:radial-gradient(70% 38% at 50% -6%,rgba(124,92,255,.26),transparent 70%) fixed,var(--bg)}
.wrap{max-width:1800px;margin:0 auto;padding:26px 18px 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:none;position:fixed;top:12px;right:68px;z-index:1000;margin:0;justify-content:flex-start;width:min(500px,calc(100vw - 90px));}
.top.open{display:flex}
.search{display:flex;align-items:center;gap:10px;width:min(560px,100%);padding:6px 14px 6px 22px;border-radius:999px;border:1px solid var(--line);background:rgba(30,30,46,.7);backdrop-filter:blur(12px);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px rgba(124,92,255,.25)}
.si{width:34px;height:34px;flex:none}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-family:'Cairo',sans-serif;font-size:1.05rem;color:var(--fg);padding:8px 0}
#q::placeholder{color:var(--mut)}
#q::-webkit-search-cancel-button{display:none}
.search-toggle{position:fixed;top:12px;right:12px;z-index:1001;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:rgba(30,30,46,.94);backdrop-filter:blur(12px);color:var(--fg);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.search-toggle svg{width:27px;height:27px;display:block}
.search-toggle:focus-visible{outline:4px solid #22d3ee;outline-offset:4px;box-shadow:0 0 0 7px rgba(34,211,238,.42),0 0 24px rgba(34,211,238,.72)}
.card:focus-visible,.feature .btn:focus-visible,.back:focus-visible,.sbtn:focus-visible,.ep:focus-visible,#q:focus-visible{outline:4px solid #22d3ee;outline-offset:4px;box-shadow:0 0 0 7px rgba(34,211,238,.42),0 0 24px rgba(34,211,238,.72);position:relative;z-index:5}
.card:focus-visible .art{transform:translateY(-4px) scale(1.025);box-shadow:0 0 0 4px #22d3ee,0 0 0 8px var(--ac),0 18px 44px rgba(0,0,0,.65)}
.search-toggle:focus-visible{z-index:1002}
.top.open .search{width:100%;padding:5px 12px;background:rgba(20,20,31,.97);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.top.open .si{width:28px;height:28px}
@media(max-width:420px){.top{right:68px;width:calc(100vw - 90px)}}
.feature{position:relative;border-radius:16px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line)}
.fbg,.bgi{position:absolute;inset:-30px;filter:blur(28px) brightness(.5) saturate(1.3);transform:scale(1.15)}
.fbg svg,.fbg img,.bgi svg,.bgi img{width:100%;height:100%;object-fit:cover;display:block}
.fin{position:relative;display:grid;grid-template-columns:92px 1fr;gap:18px;align-items:center;padding:14px 16px}
.dh .in{position:relative;display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:end;padding:32px}
.fin .art{max-width:92px;border-radius:9px}
h2.ht{font-weight:800;font-size:clamp(1.15rem,3vw,1.65rem);line-height:1.2;margin:7px 0 10px;direction:ltr;text-align:right}
.fin p,.dt p{margin:0 0 20px;max-width:58ch;color:#e4e1f0;font-family:'Cairo',sans-serif}
.fin p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;text-overflow:ellipsis;margin:8px 0 10px;max-width:58ch;font-size:.9rem;line-height:1.65;color:#d4d1e2}
.fin .tags{gap:5px}
.fin .tags span{padding:1px 9px;font-size:.72rem}
.fin .btn{padding:7px 16px;font-size:.88rem;box-shadow:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);padding:2px 14px;border-radius:999px;font-size:.85rem;font-family:'Cairo',sans-serif}
.tags .r{background:var(--gold);color:#14141f;font-weight:800}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:11px 28px;border-radius:999px;font-weight:700;font-family:'Cairo',sans-serif;background:var(--ac);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .2s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{transform:scale(1.04)}
.btn:focus-visible,.back:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}
.rowt{font-size:1.25rem;font-weight:800;margin:0 0 16px;font-family:'Cairo',sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:480px){.fin{grid-template-columns:68px 1fr;gap:12px;padding:12px}.fin .art{max-width:68px}.feature{margin-bottom:20px}.fin .tags span{font-size:.66rem;padding:1px 7px}.fin .btn{padding:6px 12px}.fin p{font-size:.8rem;-webkit-line-clamp:2;line-height:1.55;margin:6px 0 8px}}
@media(min-width:400px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}}
@media(min-width:820px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:18px}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(min-width:1800px){.grid{grid-template-columns:repeat(9,minmax(0,1fr))}}
.card{all:unset;cursor:pointer;display:block;min-width:0}
.cardtags{gap:5px;margin:8px 0 5px;align-items:center}
.cardtags span{padding:1px 7px;font-size:.68rem}
.cardtags .epcount{font-size:.68rem;padding:1px 7px}
.art{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.card:hover .art,.card:focus-visible .art{transform:translateY(-6px) scale(1.03);box-shadow:0 0 0 3px var(--ac),0 20px 44px rgba(0,0,0,.6)}
.bdg{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,10,18,.82);backdrop-filter:blur(6px);padding:3px 8px;border-radius:999px;font-size:.7rem;font-weight:800;color:var(--gold);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.epbdg{position:absolute;top:8px;inset-inline-end:8px;background:rgba(10,10,18,.84);backdrop-filter:blur(6px);padding:3px 8px;border-radius:999px;font-size:.68rem;font-weight:800;color:var(--fg);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;border:1px solid rgba(255,255,255,.14)}
.epcount{position:static;display:inline-flex;align-items:center;background:rgba(255,255,255,.12);padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--fg);font-family:'Cairo',sans-serif;direction:rtl;white-space:nowrap;border:1px solid rgba(255,255,255,.12)}
.fin .epcount{font-size:.72rem;padding:1px 9px}
@media(max-width:480px){.fin .epcount{font-size:.66rem;padding:1px 7px}}
.cm{padding:10px 2px 0;direction:ltr;text-align:left}
.cm b{display:block;font-size:clamp(.8rem,2.6vw,1rem);font-weight:700;line-height:1.25}
.cm span{display:block;font-size:clamp(.68rem,2.1vw,.82rem);color:var(--mut);font-family:'Cairo',sans-serif;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);padding:30px 0}
#detail{display:none}
.dh{position:relative;overflow:hidden;margin:calc(-26px - env(safe-area-inset-top,0px)) -18px 26px;padding:env(safe-area-inset-top,0px) 0 6px}
.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg))}
.dh>*{position:relative;z-index:1}
.dh .in{max-width:1100px;margin:0 auto;grid-template-columns:230px 1fr;align-items:end}
.dh .in .art{aspect-ratio:2/3}
.dh .bgi{z-index:0}
.back{all:unset;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;margin:12px 20px 0;background:rgba(10,10,18,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;transition:background .2s,transform .2s}
.back:hover{background:var(--ac);transform:scale(1.06)}
.back svg{width:22px;height:22px}
.dh::after{z-index:0}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--ac);padding:2px 16px;border-radius:999px;font-weight:700;font-family:'Cairo',sans-serif}
.prog{color:var(--mut);font-size:.9rem;font-family:'Cairo',sans-serif}
.pbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.pbar div{height:100%;background:var(--ac);width:0;transition:width .3s}
.eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:520px){.eps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:760px){.eps{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1000px){.eps{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:1300px){.eps{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(min-width:1700px){.eps{grid-template-columns:repeat(7,minmax(0,1fr))}}
.ep{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:16/10;padding:14px 16px;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(0,0,0,.72)),var(--ac);box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s}
.ep:hover,.ep:focus-visible{transform:translateY(-5px) scale(1.03);box-shadow:0 0 0 3px #22d3ee,0 18px 38px rgba(0,0,0,.55)}
.n{position:absolute;top:2px;inset-inline-start:14px;font-size:3.6rem;font-weight:800;line-height:1;color:rgba(255,255,255,.28)}
.n svg{display:none;width:44px;height:44px;margin-top:10px;color:#fff}
.ep.done .n b{display:none}
.ep.done .n svg{display:block;opacity:.8}
.ep.done{filter:saturate(.55) brightness(.85)}
.t{position:relative;direction:ltr;text-align:left;font-weight:700;font-size:.98rem;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pl{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;transition:background .2s,color .2s}
.pl svg{width:14px;height:14px;fill:currentColor;transform:scaleX(-1)}
.ep:hover .pl,.ep:focus-visible .pl{background:#fff;color:#14141f}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#14141f;padding:8px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700;z-index:9;font-family:'Cairo',sans-serif}

/* إعلان قبل تشغيل الفيلم */
.adgate{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,4,12,.88);backdrop-filter:blur(10px)}
.adgate.show{display:flex}
.adbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid rgba(124,92,255,.55);border-radius:22px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.6);text-align:center}
.adhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.adhead strong{font-size:1.05rem}
.adlabel{font-size:.75rem;border:1px solid rgba(255,209,102,.5);color:var(--gold);padding:3px 10px;border-radius:999px}
.adframe{width:100%;height:min(42vh,330px);min-height:220px;border:1px solid var(--line);border-radius:14px;background:#080811}
.adhint{font-size:.78rem;color:var(--mut);margin:10px 0}
.adcount{display:flex;align-items:center;justify-content:center;gap:9px;margin:12px 0 2px;color:var(--fg);font-weight:700}
.adnum{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid #22d3ee;color:#22d3ee;font-size:1.3rem}
.adcancel{all:unset;display:inline-flex;justify-content:center;cursor:pointer;margin-top:12px;padding:9px 20px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--fg);font-weight:700}
.adcancel:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}
.adcancel[hidden]{display:none}
.adprogress[hidden]{display:none}.adprogress{height:5px;width:100%;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12);margin:10px 0 0}.adprogress i{display:block;height:100%;width:100%;transform-origin:right center;transform:scaleX(1);background:#7c5cff;transition:transform .25s linear}.adgate.counter-bar .adnum{width:auto;height:auto;min-width:34px;padding:3px 10px;border-radius:999px;border-width:1px;font-size:1rem}.adgate.counter-pill .adnum{width:auto;min-width:42px;height:36px;padding:0 12px;border-radius:999px;font-size:1.15rem}.adgate.counter-circle .adnum{width:48px;height:48px;border-radius:50%}

@media(max-width:700px){.fin{grid-template-columns:1fr;padding:22px}.fin .art{display:none}.dh .in{grid-template-columns:1fr;padding:18px 20px}.dh .in .art{width:150px}.eps{gap:10px}.ep{padding:10px 12px}.n{font-size:2.8rem}.t{font-size:.85rem}}
.dh>.bgi{position:absolute;z-index:0}
.dh .back{position:relative;z-index:2}
.dh .btn{position:relative;z-index:2}
.seas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px}
.sbtn{all:unset;cursor:pointer;flex:none;padding:6px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:'Cairo',sans-serif;font-weight:700;color:var(--mut);transition:background .2s,border-color .2s}
.sbtn:hover{border-color:var(--ac);color:var(--fg)}
.sbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sbtn:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.yr{position:absolute;left:0;bottom:0;writing-mode:vertical-rl;font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(.7rem,2.7vw,.95rem);letter-spacing:.14em;line-height:1;color:#fff;padding:12px 6px 12px 5px;background:rgba(10,10,18,.62);backdrop-filter:blur(6px);border-top-right-radius:10px;border-right:2px solid var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn.sec{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);box-shadow:none;backdrop-filter:blur(6px)}
.ep.nolink{--ac:#3a3a4c}
.nl{position:absolute;top:12px;inset-inline-end:12px;background:var(--gold);color:#14141f;font-size:.7rem;font-weight:800;padding:1px 10px;border-radius:999px;font-family:'Cairo',sans-serif}
.vw{display:flex;gap:5px;align-items:center;margin-top:1px;font-size:clamp(.66rem,2vw,.8rem);color:var(--mut);font-family:'Cairo',sans-serif;direction:rtl;text-align:right;min-height:1.3em}
.vw svg,.vc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.tags .vc{display:inline-flex;gap:5px;align-items:center}
.ev{display:flex;direction:ltr;gap:4px;align-items:center;position:relative;font-size:.72rem;color:rgba(255,255,255,.85);font-family:'Cairo',sans-serif;min-height:1.2em;margin-bottom:2px}
.ev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.card .art{border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.5),0 18px 38px -16px var(--ac);border:1px solid rgba(255,255,255,.08)}
.card .art::before{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--ac);z-index:2}
.card .art::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);transform:translateX(-130%);transition:transform .8s}
.card:hover .art::after,.card:focus-visible .art::after{transform:translateX(130%)}
.card .bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;background:rgba(10,10,18,.78);border:1px solid rgba(255,209,102,.45);z-index:2}
.card .epbdg{z-index:2;padding:2px 9px;background:rgba(10,10,18,.7);font-weight:700}
.ov{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:6px;padding:30px 9px 11px;background:linear-gradient(transparent,rgba(5,5,12,.9));color:#fff;z-index:1;pointer-events:none}
.yr2{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(.68rem,2.3vw,.85rem);letter-spacing:.06em;direction:ltr;line-height:1.2}
.ov .vw{margin:0;min-height:0;color:#fff;font-size:clamp(.64rem,2vw,.78rem);font-weight:700;direction:ltr;gap:3px}
.ov .vw svg{width:12px;height:12px}
.card .cm{padding:11px 3px 0}
.card .cm b{font-weight:800;letter-spacing:.01em}
.card .cm span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-inline-end:6px;vertical-align:middle}
@media(max-width:700px){.card .art{border-radius:12px}.card .bdg,.card .epbdg{top:5px;font-size:.58rem;padding:1px 6px}.card .bdg{inset-inline-start:5px}.card .epbdg{inset-inline-end:5px}.ov{padding:22px 6px 8px}.card .cm{padding-top:7px}.card .cm b{font-size:.76rem}.card .cm span{font-size:.64rem}.card .cm span::before{width:5px;height:5px;margin-inline-end:4px}}
.card .cm{direction:rtl;text-align:right;padding-top:9px}
.card .cm b{display:block;unicode-bidi:plaintext;font-size:clamp(.7rem,2.1vw,.84rem);font-weight:700;line-height:1.35;color:#f3f1fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cm b.lat{font-family:'Outfit',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(.62rem,1.85vw,.74rem);font-weight:700}
.card .cm span{font-size:clamp(.6rem,1.7vw,.72rem);margin-top:1px}
.rs{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end}.rs[hidden]{display:none}.rsb{width:100%;max-height:78vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}.rsb h3{margin:0 0 4px;font-size:1.05rem;font-family:'Cairo',sans-serif}.rsb p{color:var(--mut);margin:0 0 12px;font-size:.85rem;font-family:'Cairo',sans-serif}.rsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.rsi{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-family:'Cairo',sans-serif;font-size:.85rem;min-width:0}.rsi b{min-width:26px;height:26px;border-radius:8px;background:var(--ac);display:grid;place-items:center;font-weight:800;flex:none}.rsi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;flex:1}.rsi.hl{border-color:var(--gold)}.rsi:focus-visible,.rsx:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}.rsx{margin-top:12px}

function fetchJSON(url){
  return new Promise(function(resolve,reject){
    function viaXHR(){
      try{
        var x=new XMLHttpRequest();
        x.open('GET',url+(url.indexOf('?')<0?'?':'&')+'_='+Date.now(),true);
        x.onload=function(){if(x.status>=200&&x.status<300){try{resolve(JSON.parse(x.responseText))}catch(e){reject(e)}}else if(x.status===404)resolve([]);else reject(new Error('status'))};
        x.onerror=function(){reject(new Error('network'))};
        x.send();
      }catch(e){reject(e)}
    }
    try{
      var p=window.fetch&&window.fetch(url,{cache:'no-store'});
      if(!p||typeof p.then!=='function'){viaXHR();return}
      p.then(function(r){if(r&&r.status===404)return [];if(!r||!r.ok)throw new Error('bad');return r.json()}).then(resolve).catch(viaXHR);
    }catch(e){viaXHR()}
  });
}

function getCount(url,tries){
  tries=tries||0;
  return new Promise(function(resolve){
    function done(status,text){
      if(status===404){resolve(0);return}
      if(status===429&&tries<2){setTimeout(function(){getCount(url,tries+1).then(resolve)},2500);return}
      if(status>=200&&status<300){try{var j=JSON.parse(text);resolve(typeof j.value==='number'?j.value:null)}catch(e){resolve(null)}return}
      resolve(null);
    }
    function viaXHR(){
      try{var x=new XMLHttpRequest();x.open('GET',url,true);x.onload=function(){done(x.status,x.responseText)};x.onerror=function(){resolve(null)};x.send()}catch(e){resolve(null)}
    }
    try{
      var p=window.fetch&&window.fetch(url,{cache:'no-store'});
      if(!p||typeof p.then!=='function'){viaXHR();return}

function countPlay(x,s,k){
  var ek=ekey(x,s,k),sk=skey(x),now=Date.now();
  if(lastHit[ek]&&now-lastHit[ek]<10000)return false;
  lastHit[ek]=now;
  try{
    new Image().src=cHit(ek);
    new Image().src=cHit(sk);
    var dy=new Date().toISOString().slice(0,10).replace(/-/g,'');
    new Image().src=cHit('d-'+dy);
    new Image().src=cHit('sd-'+ckey(x)+'-'+dy);
    views[ek]=(views[ek]||0)+1;views[sk]=(views[sk]||0)+1;saveViews();
    return true;
  }catch(e){return false}
}
function fetchCounts(keys,after){
  var qd=keys.slice(),run=0;
  function next(){
    while(run<3&&qd.length){
      (function(key){
        run++;
        getCount(cGet(key)).then(function(n){if(typeof n==='number')views[key]=n}).then(function(){run--;after();next()});
      })(qd.shift());
    }
    if(!qd.length&&!run)saveViews();
  }
  next();
}

function applyRows(payload){
  payload=unwrapData(payload);
  var rows=Array.isArray(payload)?payload:(payload.series||payload.items||payload.shows||payload.data||[]);
  if(!Array.isArray(rows))throw new Error('format');
  S=rows.filter(function(x){return x&&typeof x==='object'&&x.t;}).map(function(x,i){
    if(!x.k){x.k='series-'+i;x._auto=true}
    if(!x.ac)x.ac='#7c5cff';
    if(!Array.isArray(x.ss)){
      if(Array.isArray(x.e))x.ss=[x.e];
      else x.ss=[];
    }
    if(!x.s)x.s=x.ss.length||1;
    if(!x.r)x.r='—';
    if(!x.g)x.g='مسلسل';
    if(!x.y)x.y='';
    if(!x.d)x.d='';
    return x;
  });
  /* إخفاء المسلسلات المخفية أو المجدولة لوقت لاحق، وتثبيت المسلسلات المثبّتة في الأول */
  var nowT=Date.now();
  S=S.filter(function(x){
    if(x.hide)return false;
    if(x.showAt){var t=new Date(x.showAt).getTime();if(!isNaN(t)&&t>nowT)return false}
    return true;
  }).map(function(x,i){x._o=i;return x}).sort(function(a,b){return freshAt(b)-freshAt(a)||(b.pin?1:0)-(a.pin?1:0)||a._o-b._o});
  setupFeature();

  lockSig=lockedTotal();

}

}
function onNav(){if(det.style.display==='block'&&location.hash!=='#detail'){pushed=false;closeDetail()}}
window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
function items(){return items0().filter(function(el){return el.getClientRects().length>0&&getComputedStyle(el).visibility!=='hidden'})}
function items0(){
  if(!rsheet.hidden)return [].slice.call(rsheet.querySelectorAll('.rsi,#rsx'));
  if(det.style.display==='block')return [].slice.call(det.querySelectorAll('#bk,#play,#next,#report,.sbtn,.ep'));
  return [searchToggle,q].concat([].slice.call(list.querySelectorAll('#fb,.card')));
}
function move(d){
  var all=items(),cur=document.activeElement;
  if(all.indexOf(cur)<0){var f=(opener&&all.indexOf(opener)>-1)?opener:(all[1]||all[0]);f.focus();f.scrollIntoView({block:'nearest'});return}
  var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  all.forEach(function(el){
    if(el===cur)return;
    var b=el.getBoundingClientRect(),x=b.left+b.width/2-cx,y=b.top+b.height/2-cy,p,s;
    if(d==='L'){p=-x;s=Math.abs(y)}else if(d==='R'){p=x;s=Math.abs(y)}else if(d==='U'){p=-y;s=Math.abs(x)}else{p=y;s=Math.abs(x)}
    if(p<=1)return;
    if((d==='L'||d==='R')&&s>r.height*.6)return;
    var c=p+s*3;if(c<bs){bs=c;best=el}
  });
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'});return}
  /* Fixed-position controls can have offsetParent=null; allow ArrowUp to reach search from the topmost item. */
  if(d==='U'&&cur!==searchToggle&&all.indexOf(searchToggle)>-1){searchToggle.focus({preventScroll:true});return}
}
var DIR={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'};
document.addEventListener('keydown',function(e){
  var k=e.key,c=e.keyCode,inQ=document.activeElement===q;
  if(DIR[k]){
    if(inQ&&(k==='ArrowLeft'||k==='ArrowRight'))return;
    e.preventDefault();move(DIR[k]);return;
  }
  var isBack=k==='Escape'||k==='GoBack'||k==='BrowserBack'||c===4||c===10009||c===461||(k==='Backspace'&&!inQ);
  if(isBack&&adGate.classList.contains('show')){e.preventDefault();closeAdGate(false);return}
  if(isBack&&!rsheet.hidden){e.preventDefault();closeReport();return}
  if(isBack&&det.style.display==='block'){e.preventDefault();back()}
});
</script>
<script>
/* ===== صفحة أفلام: تعيد تعريف render / setupFeature / show / applyRows فوق مكتبة المسلسلات ===== */
(function(){
var NEW_DAYS=14,mvScroll=0,mvDirty=false;
var hero=document.getElementById('hero'),mvt=document.getElementById('mvt'),mvc=document.getElementById('mvc');
var CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
var CLOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>';
function epOf(x){return (x.ss&&x.ss[0]&&x.ss[0][0])||{}}
function gl(x){return String(x.g||'').split(/[,،·\/|]+/).map(function(t){return t.trim()}).filter(Boolean)}
function isNew(x){var t=x.addedAt?new Date(x.addedAt).getTime():0;return t>0&&Date.now()-t<NEW_DAYS*864e5}
function seen(x){var w=progressStore.watched[seriesKey(x)];return !!(w&&w[0]&&w[0][0])}
function durOf(m){m=Number(m);if(!(m>0))return '';var h=Math.floor(m/60),mm=Math.round(m%60);return (h?h+'س ':'')+(mm?mm+'د':'')}
function rnum(x){var n=parseFloat(x.r);return isNaN(n)?0:n}
function idxOf(x){return S.indexOf(x)}

function lat(s){return /[A-Za-z]/.test(s)&&!/[؀-ۿ]/.test(s)}
function durAr(m){
  m=Number(m);if(!(m>0))return '';
  var h=Math.floor(m/60),mm=Math.round(m%60),s=[];
  if(h===1)s.push('ساعة');else if(h===2)s.push('ساعتان');else if(h>2)s.push(h+' ساعات');
  if(mm)s.push(mm+' دقيقة');
  return s.join(' و');
}
function countAr(n,one,two,few,many){return n===1?one:n===2?two:n>=3&&n<=10?n+' '+few:n+' '+many}
function rateBar(x){var n=rnum(x);return n>0?'<i><s style="width:'+Math.min(100,n*10)+'%"></s></i>':'<i></i>'}
function seal(x){var n=rnum(x);return '<span class="seal'+(n>0?'':' na')+'">'+(n>0?esc(x.r):'—')+'</span>'}

function card(x){
  var i=idxOf(x),sn=seen(x);
  return '<button type="button" class="card mv" data-i="'+i+'" style="--ac:'+esc(x.ac||'#7c5cff')+'" aria-label="'+esc(x.t)+'"><div class="mc">'+seal(x)+
    (isNew(x)?'<span class="nw">جديد</span>':'')+
    '<div class="mp">'+pic(x)+(x.y?'<span class="myr">'+esc(x.y)+'</span>':'')+(x.q?'<span class="qb">'+esc(x.q)+'</span>':'')+
    '<div class="info"><h3 class="ti'+(lat(x.t)?' lat':'')+'">'+esc(x.t)+'</h3><div class="mb">'+
      (sn?'<span class="ck" title="شاهدته">'+CHK+'</span>':'')+
      (x.dur?'<span>'+durOf(x.dur)+'</span>':'')+rateBar(x)+
      '<span class="vw" data-v="'+skey(x)+'">'+vwHtml(x)+'</span></div></div></div></div></button>';
}
function wireCards(root){
  [].forEach.call(root.querySelectorAll('.card.mv'),function(b){b.onclick=function(){opener=b;show(+b.getAttribute('data-i'))}});
}
function rowHtml(title,items){
  if(!items.length)return '';
  return '<section class="mrow"><div class="mrh"><h3>'+esc(title)+'</h3><div class="mra"><button type="button" class="mrb" data-d="-1" aria-label="السابق">›</button><button type="button" class="mrb" data-d="1" aria-label="التالي">‹</button></div></div><div class="mrs">'+items.map(card).join('')+'</div></section>';
}
function wireRows(root){
  [].forEach.call(root.querySelectorAll('.mrb'),function(b){
    b.onclick=function(){var s=b.closest('.mrow').querySelector('.mrs');s.scrollBy({left:-(+b.getAttribute('data-d'))*Math.max(220,s.clientWidth*.8),behavior:'smooth'})};
  });
}
function rate(a,b){return rnum(b)-rnum(a)}
function render(){
  var v=q.value.trim().toLowerCase(),secT=(typeof SECTION_TITLE==='string'?SECTION_TITLE:'أفلام');
  var arr=v?S.filter(function(x){return String(x.t).toLowerCase().indexOf(v)>=0}):S;
  var showFeat=!v&&S.length>0;
  hero.hidden=!showFeat;
  mvt.textContent=v?'نتائج البحث':secT;
  mvc.textContent=S.length?(v?countAr(arr.length,'نتيجة واحدة','نتيجتان','نتائج','نتيجة'):countAr(S.length,'فيلم واحد','فيلمان','أفلام','فيلمًا')):'';
  if(!S.length){grid.innerHTML='<p class="empty">لم تُضَف أفلام إلى هذا القسم بعد.</p>';hero.innerHTML='';return}
  if(!arr.length){grid.innerHTML='<p class="empty">لا يوجد فيلم بهذا الاسم. جرّب كلمة أخرى.</p>';return}
  var rest=showFeat?arr.slice(1):arr;
  grid.innerHTML=rest.map(card).join('');
  wireCards(grid);
}

/* ---- بانر الفيلم الأول ---- */
var PLAYSVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>';
function setupFeature(){
  var x=S[0];
  if(!x){hero.innerHTML='';hero.hidden=true;return}
  var bg=x.bg&&/^https?:\/\//i.test(x.bg),i=idxOf(x),n=rnum(x),dr=durAr(x.dur);
  var tag=x.pin?'فيلم مميز':(isNew(x)?'أُضيف حديثًا':'');
  hero.innerHTML='<section class="mf" style="--ac:'+esc(x.ac||'#7c5cff')+'">'+
    (bg?'<div class="mfbg"><img src="'+esc(x.bg)+'" alt=""></div><div class="mfsh"></div>':'')+
    (x.y?'<span class="mfy" aria-hidden="true">'+esc(x.y)+'</span>':'')+
    '<div class="mfi"><div class="mfw">'+seal(x)+'<div class="mfp">'+pic(x)+'</div></div><div class="mft">'+
    (tag?'<span class="mfk">'+tag+'</span>':'')+
    '<h2 class="mfh'+(lat(x.t)?' lat':'')+'">'+esc(x.t)+'</h2>'+
    '<div class="mfm">'+(x.y?'<span class="y">'+esc(x.y)+'</span>':'')+(dr?'<span>'+dr+'</span>':'')+(x.q?'<b>'+esc(x.q)+'</b>':'')+(x.co?'<span>'+esc(x.co)+'</span>':'')+(n>0?'<i><s style="width:'+Math.min(100,n*10)+'%"></s></i>':'')+'</div>'+
    (x.d?'<p class="mfd">'+esc(x.d)+'</p>':'')+
    '<div class="mfb"><button type="button" class="hbtn pri" data-act="play">'+PLAYSVG+'شاهد الآن</button><button type="button" class="hbtn sec" data-act="info">التفاصيل</button></div></div></div></section>';
  [].forEach.call(hero.querySelectorAll('.hbtn'),function(b){b.onclick=function(){opener=b;if(b.getAttribute('data-act')==='play')playMovie(S[i]);else show(i)}});
}

/* ---- التشغيل ---- */
function playNow(x){
  var i=idxOf(x),ep=epOf(x),u=(ep.u||'').trim(),ua=(ep.ua||UA||'').trim(),rf=(ep.ref||REF||'').trim();
  if(!u){toast('رابط الفيلم غير متاح حاليًا');return}
  persistEpisode(i,0,0);mvDirty=true;
  var counted=countPlay(x,0,0);
  var fin=u;
  var isRes=/[?&]action=stream(?:&|$)/i.test(u)||/[?&]realid=/i.test(u);
  if(PROXY&&isRes){
    fin=PROXY.replace(/\/?$/,'/')+'proxy.m3u8?url='+encodeURIComponent(u)+(ua?'&ua='+encodeURIComponent(ua):'')+(rf?'&ref='+encodeURIComponent(rf):'');
  }else if(PROXY&&(ua||rf)){
    var path=/\.m3u8(?:$|\?)/i.test(u)?'proxy.m3u8':(/\.mp4(?:$|\?)/i.test(u)?'proxy.mp4':'proxy');
    fin=PROXY.replace(/\/?$/,'/')+path+'?url='+encodeURIComponent(u)+(ua?'&ua='+encodeURIComponent(ua):'')+(rf?'&ref='+encodeURIComponent(rf):'');
  }
  var kk=(ep.key||'').trim();
  if(PROXY&&kk){
    fin=PROXY.replace(/\/?$/,'/')+'proxy.mpd?url='+encodeURIComponent(u)+'&key='+encodeURIComponent(kk)+'&lic=own'+(ua?'&ua='+encodeURIComponent(ua):'')+(rf?'&ref='+encodeURIComponent(rf):'');
  }
  if(counted)setTimeout(function(){window.location.href=fin},180);else window.location.href=fin;
}
function playMovie(x){runWithAd(function(){playNow(x)},x)}

/* ---- صفحة التفاصيل ---- */
function show(i){trackAdNavigation();
  var x=S[i],ep=epOf(x),bg=x.bg&&/^https?:\/\//i.test(x.bg),sn=seen(x);
  mvScroll=window.scrollY;
  var gs=gl(x),sim=S.filter(function(y){return y!==x}).map(function(y){var o=gl(y).filter(function(g){return gs.indexOf(g)>=0}).length;return {y:y,o:o}}).filter(function(a){return a.o>0}).sort(function(a,b){return b.o-a.o||rnum(b.y)-rnum(a.y)}).slice(0,14).map(function(a){return a.y});
  det.innerHTML='<div class="md" style="--ac:'+esc(x.ac||'#7c5cff')+'"><div class="mdh"><div class="mdbg'+(bg?'':' blur')+'">'+(bg?'<img src="'+esc(x.bg)+'" alt="">':pic(x))+'</div>'+
    '<button class="back" id="bk" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>'+
    '<div class="mdin">'+art(x)+'<div>'+
    (gs.length?'<div class="mdg">'+gs.map(function(g){return '<span>'+esc(g)+'</span>'}).join('')+'</div>':'')+
    '<h2 class="ht">'+esc(x.t)+'</h2>'+
    '<div class="mdt"><span class="r">★ '+esc(x.r)+'</span><span>'+esc(x.y)+'</span>'+(x.dur?'<span>'+CLOCK+durOf(x.dur)+'</span>':'')+(x.q?'<span class="q">'+esc(x.q)+'</span>':'')+(x.co?'<span>'+esc(x.co)+'</span>':'')+(viewsOf(x)>0?'<span class="vc">'+EYE+fmtViews(viewsOf(x))+' مشاهدة</span>':'')+'</div>'+
    (x.d?'<p class="mdd">'+esc(x.d)+'</p>':'')+
    '<div class="mdb"><button type="button" class="mdbtn pri" id="mplay">'+PLAYSVG+(sn?'شاهد مرة أخرى':'شاهد الآن')+'</button>'+
    (x.tr&&/^https?:\/\//i.test(x.tr)?'<button type="button" class="mdbtn sec" id="mtr">الإعلان التشويقي</button>':'')+
    '<button type="button" class="mdbtn sec" id="mrep">أبلغ عن رابط لا يعمل</button></div>'+
    (sn?'<div class="mdseen">'+CHK+'شاهدت هذا الفيلم من قبل</div>':'')+
    (x.src?'<p class="srcl" style="margin:12px 0 0">المصدر: '+esc(x.src)+'</p>':'')+
    '</div></div></div>'+(sim.length?'<div class="mdsim">'+rowHtml('قد يعجبك أيضًا',sim)+'</div>':'')+'</div>';
  list.style.display='none';det.style.display='block';document.body.classList.add('indet');window.scrollTo(0,0);
  pushDetail();
  document.getElementById('bk').onclick=back;
  document.getElementById('mplay').onclick=function(){playMovie(x)};
  document.getElementById('mrep').onclick=function(){sendReport(x,0,0)};
  var tr=document.getElementById('mtr');if(tr)tr.onclick=function(){var w=null;try{w=window.open(x.tr,'_blank','noopener')}catch(e){}if(!w)window.location.href=x.tr};
  wireRows(det);wireCards(det);
  document.getElementById('mplay').focus({preventScroll:true});
  loadEpViews(x,0,1);
}
function closeDetail(){
  if(location.hash==='#detail'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  det.style.display='none';list.style.display='block';document.body.classList.remove('indet');
  if(mvDirty){mvDirty=false;render()}
  window.scrollTo(0,mvScroll||0);
  if(opener&&document.contains(opener)){try{opener.focus({preventScroll:true})}catch(e){}}
}
window.show=show;window.closeDetail=closeDetail;window.render=render;window.setupFeature=setupFeature;

/* ---- القوائم والمفاتيح ---- */
window.items0=function(){
  if(!rsheet.hidden)return [].slice.call(rsheet.querySelectorAll('.rsi,#rsx'));
  if(det.style.display==='block')return [].slice.call(det.querySelectorAll('#bk,.mdbtn,.mrb,.card'));
  return [searchToggle,q].concat([].slice.call(list.querySelectorAll('.hbtn,.card')));
};
q.oninput=function(){render()};
window.refreshViews=function(){[].forEach.call(document.querySelectorAll('.vw'),function(el){var n=views[el.getAttribute('data-v')];el.innerHTML=n>0?EYE+fmtViews(n):''})};

/* ---- تحميل البيانات: كل فيلم = حلقة واحدة داخل ss عشان الإدارة والعدّادات وفحص الروابط تشتغل بنفس النظام ---- */
window.applyRows=function(payload){
  payload=unwrapData(payload);
  var rows=Array.isArray(payload)?payload:(payload.movies||payload.series||payload.items||payload.data||[]);
  if(!Array.isArray(rows))throw new Error('format');
  S=rows.filter(function(x){return x&&typeof x==='object'&&x.t}).map(function(x,i){
    if(!x.k){x.k='movie-'+i;x._auto=true}
    if(!x.ac)x.ac='#7c5cff';
    if(!Array.isArray(x.ss)||!Array.isArray(x.ss[0])||!x.ss[0].length){
      var e={t:x.t,u:x.u||''};if(x.ua)e.ua=x.ua;if(x.ref)e.ref=x.ref;if(x.key)e.key=x.key;x.ss=[[e]];
    }
    x.s=1;if(!x.r)x.r='—';if(!x.g)x.g='فيلم';if(!x.y)x.y='';if(!x.d)x.d='';
    return x;
  });
  var nowT=Date.now();
  S=S.filter(function(x){
    if(x.hide)return false;
    if(x.showAt){var t=new Date(x.showAt).getTime();if(!isNaN(t)&&t>nowT)return false}
    return true;
  }).map(function(x,i){x._o=i;return x}).sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||a._o-b._o});
  S.forEach(function(x,i){x._o=i});
  setupFeature();render();
  lockSig=lockedTotal();
  loadViews();
};
/* تنظيف نص الإعلان: «الحلقة» → «الفيلم» */
var _aas=window.applyAdSettings;
window.applyAdSettings=function(){
  adSettings.title=String(adSettings.title).replace('الحلقة','الفيلم');
  adSettings.buttonText=String(adSettings.buttonText).replace('الحلقة','الفيلم');
  _aas();
};
loadSeries();
})();
</script>
