<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>مكتبة المسلسلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--card:#14141f;--card2:#1e1e2e;--line:#262637;--fg:#f5f4fa;--mut:#9795ab;--ac:#7c5cff;--gold:#ffd166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:'Outfit','Cairo',Tahoma,Arial,sans-serif;line-height:1.7;background:radial-gradient(70% 38% at 50% -6%,rgba(124,92,255,.26),transparent 70%) fixed,var(--bg)}
.wrap{max-width:1800px;margin:0 auto;padding:26px 18px 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;justify-content:center;margin-bottom:26px}
.search{display:flex;align-items:center;gap:10px;width:min(560px,100%);padding:6px 14px 6px 22px;border-radius:999px;border:1px solid var(--line);background:rgba(30,30,46,.7);backdrop-filter:blur(12px);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px rgba(124,92,255,.25)}
.si{width:34px;height:34px;flex:none}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-family:'Cairo',sans-serif;font-size:1.05rem;color:var(--fg);padding:8px 0}
#q::placeholder{color:var(--mut)}
#q::-webkit-search-cancel-button{display:none}
.cats{display:flex;gap:9px;overflow-x:auto;padding:0 2px 20px;margin-top:-8px;scrollbar-width:thin}.catbtn{all:unset;cursor:pointer;flex:none;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(30,30,46,.75);color:var(--mut);font-family:'Cairo',sans-serif;font-weight:700;transition:background .2s,border-color .2s,color .2s}.catbtn:hover{border-color:var(--ac);color:var(--fg)}.catbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}.catbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.feature{position:relative;border-radius:20px;overflow:hidden;margin-bottom:38px;border:1px solid var(--line)}
.fbg,.bgi{position:absolute;inset:-30px;filter:blur(28px) brightness(.5) saturate(1.3);transform:scale(1.15)}
.fbg svg,.fbg img,.bgi svg,.bgi img{width:100%;height:100%;object-fit:cover;display:block}
.fin,.dh .in{position:relative;display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:center;padding:32px}
.fin .art{max-width:210px}
h2.ht{font-weight:800;font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:10px 0 12px;direction:ltr;text-align:right}
.fin p,.dt p{margin:0 0 20px;max-width:58ch;color:#e4e1f0;font-family:'Cairo',sans-serif}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);padding:2px 14px;border-radius:999px;font-size:.85rem;font-family:'Cairo',sans-serif}
.tags .r{background:var(--gold);color:#14141f;font-weight:800}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:11px 28px;border-radius:999px;font-weight:700;font-family:'Cairo',sans-serif;background:var(--ac);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .2s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{transform:scale(1.04)}
.btn:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
.rowt{font-size:1.25rem;font-weight:800;margin:0 0 16px;font-family:'Cairo',sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr);gap:22px}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1600px){.grid{grid-template-columns:repeat(7,1fr)}}
.card{all:unset;cursor:pointer;display:block}
.art{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s}
.art svg,.art img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.card:hover .art,.card:focus-visible .art{transform:translateY(-6px) scale(1.03);box-shadow:0 0 0 3px var(--ac),0 20px 44px rgba(0,0,0,.6)}
.bdg{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,10,18,.72);backdrop-filter:blur(6px);padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:800;color:var(--gold)}
.cm{padding:10px 2px 0;direction:ltr;text-align:left}
.cm b{display:block;font-size:clamp(.8rem,2.6vw,1rem);font-weight:700;line-height:1.25}
.cm span{display:block;font-size:clamp(.68rem,2.1vw,.82rem);color:var(--mut);font-family:'Cairo',sans-serif;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);padding:30px 0}
#detail{display:none}
.dh{position:relative;overflow:hidden;margin:calc(-26px - env(safe-area-inset-top,0px)) -18px 26px;padding:env(safe-area-inset-top,0px) 0 6px}
.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg))}
.dh>*{position:relative;z-index:1}
.dh .in{max-width:1100px;margin:0 auto;grid-template-columns:230px 1fr;align-items:end}
.dh .in .art{aspect-ratio:2/3}
.dh .bgi{z-index:0}
.back{all:unset;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;margin:12px 20px 0;background:rgba(10,10,18,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;transition:background .2s,transform .2s}
.back:hover{background:var(--ac);transform:scale(1.06)}
.back svg{width:22px;height:22px}
.dh::after{z-index:0}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--ac);padding:2px 16px;border-radius:999px;font-weight:700;font-family:'Cairo',sans-serif}
.prog{color:var(--mut);font-size:.9rem;font-family:'Cairo',sans-serif}
.pbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.pbar div{height:100%;background:var(--ac);width:0;transition:width .3s}
.eps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:520px){.eps{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.eps{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.eps{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1300px){.eps{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1700px){.eps{grid-template-columns:repeat(7,1fr)}}
.ep{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:16/10;padding:14px 16px;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(0,0,0,.72)),var(--ac);box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s}
.ep:hover,.ep:focus-visible{transform:translateY(-5px) scale(1.03);box-shadow:0 0 0 3px #fff,0 18px 38px rgba(0,0,0,.55)}
.n{position:absolute;top:2px;inset-inline-start:14px;font-size:3.6rem;font-weight:800;line-height:1;color:rgba(255,255,255,.28)}
.n svg{display:none;width:44px;height:44px;margin-top:10px;color:#fff}
.ep.done .n b{display:none}
.ep.done .n svg{display:block;opacity:.8}
.ep.done{filter:saturate(.55) brightness(.85)}
.t{position:relative;direction:ltr;text-align:left;font-weight:700;font-size:.98rem;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pl{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;transition:background .2s,color .2s}
.pl svg{width:14px;height:14px;fill:currentColor;transform:scaleX(-1)}
.ep:hover .pl,.ep:focus-visible .pl{background:#fff;color:#14141f}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#14141f;padding:8px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700;z-index:9;font-family:'Cairo',sans-serif}
@media(max-width:700px){.fin{grid-template-columns:1fr;padding:22px}.fin .art{display:none}.dh .in{grid-template-columns:1fr;padding:18px 20px}.dh .in .art{width:150px}.eps{gap:10px}.ep{padding:10px 12px}.n{font-size:2.8rem}.t{font-size:.85rem}}
.dh>.bgi{position:absolute;z-index:0}
.dh .back{position:relative;z-index:2}
.dh .btn{position:relative;z-index:2}
.seas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px}
.sbtn{all:unset;cursor:pointer;flex:none;padding:6px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:'Cairo',sans-serif;font-weight:700;color:var(--mut);transition:background .2s,border-color .2s}
.sbtn:hover{border-color:var(--ac);color:var(--fg)}
.sbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.yr{position:absolute;left:0;bottom:0;writing-mode:vertical-rl;font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(.7rem,2.7vw,.95rem);letter-spacing:.14em;line-height:1;color:#fff;padding:12px 6px 12px 5px;background:rgba(10,10,18,.62);backdrop-filter:blur(6px);border-top-right-radius:10px;border-right:2px solid var(--ac)}


</style>
</head>

var PLAYI='<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
var list=document.getElementById('list'),grid=document.getElementById('grid'),det=document.getElementById('detail'),q=document.getElementById('q'),feat=document.getElementById('feat'),rowt=document.getElementById('rowt'),cats=document.getElementById('cats'),done={},opener=null;
var ACTIVE_CAT='all';
function tags(x){return '<div class="tags"><span class="r">★ '+x.r+'</span><span>'+x.y+'</span><span>'+esc(x.g)+'</span><span>'+x.s+' مواسم</span></div>'}
function renderCategories(){
  var opts=[{id:'all',label:'كل الأقسام'}].concat(SERIES_FILES);
  cats.innerHTML=opts.map(function(c){return '<button type="button" class="catbtn'+(ACTIVE_CAT===c.id?' on':'')+'" data-cat="'+c.id+'">'+c.label+'</button>'}).join('');
  cats.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){ACTIVE_CAT=b.getAttribute('data-cat');renderCategories();render()}});
}
function visibleIndexes(){var v=q.value.trim().toLowerCase(),out=[];S.forEach(function(x,i){if(ACTIVE_CAT!=='all'&&(x.cat||'foreign')!==ACTIVE_CAT)return;if(v&&String(x.t||'').toLowerCase().indexOf(v)<0)return;out.push(i)});return out}
function renderFeatured(){
  if(!S.length){feat.innerHTML='<div class="fin"><div><h2 class="ht">مكتبة المسلسلات</h2><p>لا توجد مسلسلات متاحة حاليًا.</p></div></div>';return}
  var x=S[0];
  feat.innerHTML='<div class="fbg">'+pic(x)+'</div><div class="fin">'+art(x)+'<div>'+tags(x)+'<h2 class="ht">'+esc(x.t)+'</h2><p>'+esc(x.d||'')+'</p><button class="btn" id="fb" style="--ac:'+x.ac+'">'+PLAYI+'عرض الحلقات</button></div></div>';
  var fb=document.getElementById('fb');fb.onclick=function(){opener=fb;show(0)};
}
function render(){
  var indexes=visibleIndexes();grid.innerHTML='';
  feat.style.display=(q.value.trim()||ACTIVE_CAT!=='all')?'none':'';
  rowt.textContent=ACTIVE_CAT==='all'?'كل المسلسلات':'مسلسلات '+(SERIES_FILES.find(function(c){return c.id===ACTIVE_CAT})||{}).label;
  indexes.forEach(function(i){var x=S[i];var b=document.createElement('button');b.className='card';b.style.setProperty('--ac',x.ac||'#7c5cff');
    b.innerHTML=art(x,'<span class="bdg">★ '+esc(x.r||'—')+'</span><span class="yr">'+esc(x.y||'')+'</span>')+'<div class="cm"><b>'+esc(x.t)+'</b><span>'+esc(x.g||'مسلسل')+'</span></div>';
    b.onclick=function(){opener=b;show(i)};grid.appendChild(b);
  });
  if(!indexes.length)grid.innerHTML='<p class="empty">مفيش مسلسلات في القسم ده حاليًا، أو جرّب اسم تاني.</p>';

renderCategories();renderFeatured();q.oninput=render;render();
/* كل قسم يُقرأ من ملف JSON مستقل في المستودع الجديد. */
function validSeriesList(arr){return Array.isArray(arr)&&arr.every(function(x){return x&&typeof x.t==='string'&&Array.isArray(x.ss)})}
function loadRemoteSeries(){
  if(GITHUB_OWNER==='YOUR_GITHUB_USERNAME'||!GITHUB_REPO){console.warn('حدّد اسم مستخدم GitHub والمستودع في إعدادات المكتبة.');return}
  Promise.all(SERIES_FILES.map(function(cat){
    return fetch(rawSeriesUrl(cat.file)+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(cat.file+' HTTP '+r.status);return r.json()}).then(function(data){if(!validSeriesList(data))throw new Error(cat.file+' JSON format');return data.map(function(x){return Object.assign({},x,{cat:cat.id})})}).catch(function(err){console.warn('تعذر تحميل '+cat.file+':',err);return []})
  })).then(function(groups){CUSTOM_S=[].concat.apply([],groups);S=BASE_S.concat(CUSTOM_S);renderFeatured();renderCategories();render()})
}
loadRemoteSeries();
function seasonsOf(x){return x.ss||[x.e]}
function cnt(i,s){var d=done[i][s]||{};return Object.keys(d).filter(function(k){return d[k]}).length}
var tt;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){t.style.opacity=0},2200)}
function show(i){
  var x=S[i],SS=seasonsOf(x),cs=0;done[i]=done[i]||{};
  SS.forEach(function(_,j){done[i][j]=done[i][j]||{}});
  var CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
  var tabs=SS.length>1?'<div class="seas">'+SS.map(function(_,j){return '<button class="sbtn'+(j===0?' on':'')+'" data-s="'+j+'">الموسم '+(j+1)+'</button>'}).join('')+'</div>':'';
  det.innerHTML='<div style="--ac:'+x.ac+'"><div class="dh"><div class="bgi">'+pic(x)+'</div><button class="back" id="bk" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><div class="in">'+art(x)+
  '<div class="dt">'+tags(x)+'<h2 class="ht">'+esc(x.t)+'</h2><p>'+esc(x.d)+'</p><button class="btn" id="play">'+PLAYI+'ابدأ المشاهدة</button></div></div></div>'+tabs+
  '<div class="eh"><span class="pill" id="pn"></span><span class="prog" id="pg"></span></div><div class="pbar"><div id="bf"></div></div><div class="eps" id="eps"></div></div>';
  var box=document.getElementById('eps'),E=[],TB=det.querySelectorAll('.sbtn');
  function upd(){var n=SS[cs].length,c=cnt(i,cs);document.getElementById('pn').textContent='الموسم '+(cs+1);document.getElementById('pg').textContent='شاهدت '+c+' من '+n;document.getElementById('bf').style.width=(c/n*100)+'%'}
  async function go(k){
    var ep=SS[cs][k],u=(ep.u||'').trim(),ua=(ep.ua||UA||'').trim(),rf=(ep.ref||REF||'').trim();
    if(!u){toast('لسه مفيش رابط للحلقة '+(k+1));return}
    var fin=u;
    if(/[?&]action=stream(?:&|$)/i.test(u)||/[?&]realid=/i.test(u)){
      toast('جارٍ تجهيز رابط البث…');
      try{
        var response=await fetch(u,{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        var data=await response.json();
        if(!data||typeof data.url!=='string'||!/^https?:\/\//i.test(data.url))throw new Error('Missing stream URL');
        fin=data.url;
        if(!ua&&data.user_agent)ua=String(data.user_agent);
      }catch(err){
        toast('تعذر تجهيز البث؛ قد يمنع المصدر طلبات CORS');
        console.error('Stream resolver error:',err);
        return;
      }
    }
    done[i][cs][k]=true;E[k].classList.add('done');upd();
    if(PROXY&&(ua||rf)){
      var path=/\.m3u8(?:$|\?)/i.test(fin)?'proxy.m3u8':(/\.mp4(?:$|\?)/i.test(fin)?'proxy.mp4':'proxy');
      fin=PROXY.replace(/\/?$/,'/')+path+'?url='+encodeURIComponent(fin)+(ua?'&ua='+encodeURIComponent(ua):'')+(rf?'&ref='+encodeURIComponent(rf):'');
    }
    window.location.href=fin;
  }
  function draw(){
    box.innerHTML=SS[cs].map(function(ep,k){return '<button class="ep'+(done[i][cs][k]?' done':'')+'" data-k="'+k+'"><span class="n"><b>'+(k+1)+'</b>'+CK+'</span><span class="t">'+esc(ep.t)+'</span><span class="pl">'+PLAYI+'</span></button>'}).join('');
    E=box.querySelectorAll('.ep');
    E.forEach(function(el){el.onclick=function(){go(+el.getAttribute('data-k'))}});
    upd();
  }
  function sw(s){cs=s;TB.forEach(function(b,j){b.classList.toggle('on',j===s)});draw()}
  TB.forEach(function(b,j){b.onclick=function(){sw(j)}});
  draw();list.style.display='none';det.style.display='block';window.scrollTo(0,0);
  pushDetail();
  var bk=document.getElementById('bk'),pl=document.getElementById('play');
  bk.onclick=back;
  pl.onclick=function(){
    for(var s=0;s<SS.length;s++)for(var j=0;j<SS[s].length;j++)if(!done[i][s][j]){sw(s);go(j);return}
    sw(0);go(0);
  };
  pl.focus();
}
var pushed=false;
function pushDetail(){try{if(location.hash==='#detail')history.replaceState(null,'',location.pathname+location.search);location.hash='detail';pushed=true}catch(e){pushed=false}}
function closeDetail(){if(location.hash==='#detail'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}det.style.display='none';list.style.display='block';if(opener){opener.focus({preventScroll:true});opener.scrollIntoView({block:'center'})}else window.scrollTo(0,0)}
function back(){
  if(pushed){pushed=false;try{history.back();setTimeout(function(){if(det.style.display==='block')closeDetail()},250)}catch(e){closeDetail()}}
  else closeDetail();
}
function onNav(){if(det.style.display==='block'&&location.hash!=='#detail'){pushed=false;closeDetail()}}
window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
function items(){return items0().filter(function(el){return el.offsetParent!==null})}
function items0(){
  if(det.style.display==='block')return [].slice.call(det.querySelectorAll('#bk,#play,.sbtn,.ep'));
  return [q].concat([].slice.call(list.querySelectorAll('#fb,.card')));
}
function move(d){
  var all=items(),cur=document.activeElement;
  if(all.indexOf(cur)<0){var f=(opener&&all.indexOf(opener)>-1)?opener:(all[1]||all[0]);f.focus();f.scrollIntoView({block:'nearest'});return}
  var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  all.forEach(function(el){
    if(el===cur)return;
    var b=el.getBoundingClientRect(),x=b.left+b.width/2-cx,y=b.top+b.height/2-cy,p,s;
    if(d==='L'){p=-x;s=Math.abs(y)}else if(d==='R'){p=x;s=Math.abs(y)}else if(d==='U'){p=-y;s=Math.abs(x)}else{p=y;s=Math.abs(x)}
    if(p<=1)return;
    if((d==='L'||d==='R')&&s>r.height*.6)return;
    var c=p+s*3;if(c<bs){bs=c;best=el}
  });
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
}
var DIR={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'};
document.addEventListener('keydown',function(e){
  var k=e.key,c=e.keyCode,inQ=document.activeElement===q;
  if(DIR[k]){
    if(inQ&&(k==='ArrowLeft'||k==='ArrowRight'))return;
    e.preventDefault();move(DIR[k]);return;
  }
  var isBack=k==='Escape'||k==='GoBack'||k==='BrowserBack'||c===4||c===10009||c===461||(k==='Backspace'&&!inQ);
  if(isBack&&det.style.display==='block'){e.preventDefault();back()}
});
